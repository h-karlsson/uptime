name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$BASE..$HEAD"
          git cat-file -e "$BASE" 2>/dev/null || range="-1 $HEAD"
          status=0
          for sha in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            sh scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: uptime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d uptime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://admin:password@localhost:5432/uptime_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Check generated sqlc code is up to date
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 diff
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
