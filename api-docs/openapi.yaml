openapi: 3.1.0
info:
  title: Uptime API
  version: 0.1.0
  description: |
    API for the Uptime monitor. Authentication uses an HTTP-only `session` cookie that is set by
    register and login, so browsers send it automatically and JavaScript never handles tokens.
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: Health
  - name: Auth
    description: Email-first sign in, registration, and sessions.
  - name: Monitors
    description: The logged-in user's monitors. Other users' monitors respond 404.
  - name: Stats
    description: Check history of the logged-in user's monitors. Other users' monitors respond 404.

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API and database health
      responses:
        '200':
          description: The API and database are up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, database: up }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: unavailable, database: down }

  /api/auth/check-email:
    post:
      tags: [Auth]
      operationId: checkEmail
      summary: Check whether an email is registered
      description: First step of the email-first flow. The client shows the password field for registered emails and the registration form otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckEmailRequest' }
      responses:
        '200':
          description: Whether the email is registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckEmailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account and log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created. The response sets the session cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The email is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: email is already registered }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Logged in. The response sets the session cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Unknown email or wrong password. The response doesn't say which.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: invalid email or password }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      description: Deletes the session and clears the cookie. Succeeds even without a session.
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              description: Expires the `session` cookie.
              schema: { type: string }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Log out everywhere
      description: Deletes every session of the logged-in user, including the current one, and clears the cookie.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: All sessions ended.
          headers:
            Set-Cookie:
              description: Expires the `session` cookie.
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the logged-in user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The logged-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/monitors:
    get:
      tags: [Monitors]
      operationId: listMonitors
      summary: List monitors
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The user's monitors, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Monitors]
      operationId: createMonitor
      summary: Create a monitor
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorInput' }
      responses:
        '201':
          description: The created monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The user already monitors this URL, or has reached the limit of 10 monitors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                duplicateUrl: { value: { error: you already have a monitor for this url } }
                limitReached: { value: { error: you can have at most 10 monitors } }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/monitors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Monitors]
      operationId: getMonitor
      summary: Get a monitor
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MonitorNotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Monitors]
      operationId: updateMonitor
      summary: Replace a monitor's settings
      description: Takes every editable field. The monitor is checked again right away.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorInput' }
      responses:
        '200':
          description: The updated monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MonitorNotFound' }
        '409':
          description: Another of the user's monitors already has this URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: you already have a monitor for this url }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Monitors]
      operationId: deleteMonitor
      summary: Delete a monitor
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MonitorNotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/monitors/{id}/stats:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stats]
      operationId: getMonitorStats
      summary: Uptime and response times over a range
      security:
        - sessionCookie: []
      parameters:
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        '200':
          description: Statistics for the range, with response times grouped into buckets (15 min for 24h, 2 h for 7d, 6 h for 30d).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MonitorNotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/monitors/{id}/days:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stats]
      operationId: listMonitorDays
      summary: Uptime per day
      description: The last 30 UTC days, oldest first. Days without checks are left out.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Uptime per day.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UptimeDay' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MonitorNotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/monitors/{id}/incidents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Stats]
      operationId: listMonitorIncidents
      summary: Recent incidents
      description: The 20 most recent incidents, newest first.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Recent incidents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MonitorNotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >-
        Sessions last 30 days. A request made with less than 15 days left extends the session
        and re-sends the cookie with the new expiry.

  headers:
    SessionCookie:
      description: '`session=<token>; Path=/; Expires=<30 days>; HttpOnly; Secure; SameSite=Lax`'
      schema: { type: string }

  schemas:
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: integer, format: int64, example: 1 }
        email: { type: string, format: email, example: demo@uptime.io }
        createdAt: { type: string, format: date-time }

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Trimmed and lowercased by the server.
          example: demo@uptime.io
        password:
          type: string
          minLength: 8
          description: 8 characters to 72 bytes (the bcrypt limit).
          example: demo1234

    CheckEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, example: demo@uptime.io }

    CheckEmailResponse:
      type: object
      required: [registered]
      properties:
        registered: { type: boolean }

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        database: { type: string, enum: [up, down] }

    Monitor:
      type: object
      required: [id, name, url, method, intervalSeconds, timeoutMs, expectedStatus, enabled, status, createdAt]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Example }
        url: { type: string, format: uri, example: 'https://example.com' }
        method: { type: string, enum: [GET, HEAD] }
        intervalSeconds: { type: integer, example: 60 }
        timeoutMs: { type: integer, example: 10000 }
        expectedStatus: { type: integer, example: 200 }
        enabled: { type: boolean, description: False while the monitor is paused. }
        status:
          type: string
          enum: [up, down, unknown]
          description: Result of the latest checks; unknown until the monitor has been checked.
        createdAt: { type: string, format: date-time }

    MonitorInput:
      type: object
      additionalProperties: false
      required: [name, url, method, intervalSeconds, timeoutMs, expectedStatus, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Example }
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            An http or https address, unique per user. Stored in canonical form (lowercase host,
            "/" for an empty path, no fragment), so "https://Example.com" and "https://example.com/"
            count as the same URL.
          example: 'https://example.com/'
        method:
          type: string
          enum: [GET, HEAD]
          description: Case-insensitive; stored in uppercase.
        intervalSeconds: { type: integer, minimum: 30, maximum: 86400, example: 60 }
        timeoutMs: { type: integer, minimum: 1000, maximum: 30000, example: 10000 }
        expectedStatus: { type: integer, minimum: 100, maximum: 599, example: 200 }
        enabled: { type: boolean, example: true }

    MonitorStats:
      type: object
      required: [range, checks, uptimePercent, avgLatencyMs, p95LatencyMs, lastCheckedAt, latency]
      properties:
        range: { type: string, enum: [24h, 7d, 30d] }
        checks: { type: integer, description: Checks in the range. }
        uptimePercent:
          type: [number, 'null']
          description: Share of successful checks; null without checks.
          example: 99.86
        avgLatencyMs:
          type: [integer, 'null']
          description: Average response time of successful checks; null without any.
        p95LatencyMs:
          type: [integer, 'null']
          description: 95th percentile response time of successful checks; null without any.
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
          description: Time of the latest check, also outside the range.
        latency:
          type: array
          items: { $ref: '#/components/schemas/LatencyPoint' }

    LatencyPoint:
      type: object
      required: [time, checks, failedChecks, avgLatencyMs]
      properties:
        time: { type: string, format: date-time, description: Start of the bucket. }
        checks: { type: integer }
        failedChecks: { type: integer }
        avgLatencyMs: { type: [integer, 'null'], description: Null when every check in the bucket failed. }

    UptimeDay:
      type: object
      required: [date, checks, uptimePercent]
      properties:
        date: { type: string, format: date, example: '2026-10-12' }
        checks: { type: integer }
        uptimePercent: { type: number }

    Incident:
      type: object
      required: [id, startedAt, resolvedAt, cause]
      properties:
        id: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time, description: Null while the incident is ongoing. }
        cause: { type: [string, 'null'], example: timed out after 10s }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message that is safe to show to the user.

  responses:
    BadRequest:
      description: Invalid JSON body or input that fails validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidJson: { value: { error: 'Invalid JSON body: check syntax, field names, and field types' } }
            invalidEmail: { value: { error: email must be a valid address } }
            shortPassword: { value: { error: password must be at least 8 characters } }
    MonitorNotFound:
      description: No monitor with this id belongs to the logged-in user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: monitor not found }
    Unauthorized:
      description: No valid session cookie.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not logged in }
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Internal server error }
